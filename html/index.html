<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"></head><body><div id="phone" class="iphone hidden"><div class="shell"><header><span id="clock">9:41</span><span>●●● ▰</span></header><div class="island"></div><section id="home"><div class="home-greeting">Welcome back</div><h1>AGC Phone</h1><p id="my-number">Loading number...</p><div class="apps"><button data-app="dialer">📞<small>Phone</small></button><button data-app="messages">💬<small>Messages</small></button><button data-app="contacts">👥<small>Contacts</small></button><button data-app="settings">⚙️<small>Settings</small></button></div></section><section id="dialer" class="page"><h2>Phone</h2><input id="dial-number" placeholder="10-digit phone number" maxlength="10" inputmode="numeric"><button id="dial">Call</button><h3>Recent calls</h3><div id="history"></div></section><section id="settings" class="page"><h2>Settings</h2><p>Appearance</p><button class="choice" data-theme="iphone">iPhone Style</button><button class="choice" data-theme="samsung">Samsung Style</button></section><section id="messages" class="page"><h2>Messages</h2><div id="conversations"></div><div id="thread"></div><input id="recipient" placeholder="10-digit phone number" maxlength="10"><textarea id="body" placeholder="Message" maxlength="1000"></textarea><button id="send">Send</button></section><section id="contacts" class="page"><h2>Contacts</h2><input id="contact-name" maxlength="80" placeholder="Contact name"><input id="contact-photo" maxlength="500" placeholder="Photo HTTPS URL (optional)"><input id="contact-number" maxlength="10" placeholder="10-digit number"><button id="save-contact">Save contact</button><div id="contact-list"></div></section><section id="call-screen" class="page"><h2 id="call-title">Call</h2><div id="call-avatar" class="call-avatar">☎</div><p id="call-number"></p><button id="answer" style="display:none">Answer</button><bu
